name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "MANGAKA_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "MANGAKA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "MANGAKA_KEY_ALIAS=${KEY_ALIAS:-mangaka}"
            } >> "$GITHUB_ENV"
            echo "Signing with the permanent release key."
          else
            echo "::warning::KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets not set; signing with a temporary key. Builds won't install over each other."
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Mangaka-build-${{ github.run_number }}.apk"

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mangaka build ${{ github.run_number }}
          body: |
            ${{ github.event.head_commit.message }}

            Install: download the .apk below on your tablet and open it.
          files: out/*.apk
          make_latest: true
