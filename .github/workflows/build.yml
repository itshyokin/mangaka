name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            KS="$RUNNER_TEMP/release.keystore"
            echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$KS"
            # Check the password and find the key alias inside the keystore.
            if ! LISTING=$(keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" 2>&1); then
              echo "::error::KEYSTORE_PASSWORD does not open the keystore in KEYSTORE_BASE64: $LISTING"
              exit 1
            fi
            ALIAS="$KEY_ALIAS"
            if [ -z "$ALIAS" ]; then
              ALIAS=$(keytool -list -v -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" | sed -n 's/^Alias name: //p' | head -n 1)
            fi
            if [ -z "$ALIAS" ]; then
              echo "::error::No key found in the keystore."
              exit 1
            fi
            echo "Signing with key alias: $ALIAS"
            {
              echo "MANGAKA_KEYSTORE=$KS"
              echo "MANGAKA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "MANGAKA_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
              echo "MANGAKA_KEY_ALIAS=$ALIAS"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets not set; signing with a temporary key. Builds won't install over each other."
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # Surface compiler errors as annotations, which show on the run's summary page.
            grep -E "^e: |error:|What went wrong" -A2 build.log | head -n 40 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
            exit "$status"
          fi
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Mangaka-build-${{ github.run_number }}.apk"

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mangaka build ${{ github.run_number }}
          body: |
            ${{ github.event.head_commit.message }}

            Install: download the .apk below on your tablet and open it.
          files: out/*.apk
          make_latest: true
